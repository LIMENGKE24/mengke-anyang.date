<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f3eb">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="梦可与安阳的小小主页。一起，把平凡的日子过成纪念。">
  <title>梦可 & 安阳 · 我们的小小主页</title>
  <style>
    :root{color-scheme:light;--paper:#f7f3eb;--ink:#343e35;--muted:#777b6c;--line:#deded0;--green:#536a50}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
    .page{max-width:1060px;margin:auto;padding:30px 42px 24px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:22px;font-size:11px;letter-spacing:2px}.brand{font-family:Georgia,serif;font-size:22px;letter-spacing:1px}.tag{color:var(--muted)}main{text-align:center;padding:64px 0 30px}.eyebrow{font-size:10px;letter-spacing:4px;color:var(--green)}.art{width:190px;height:126px;margin:28px auto 10px;display:block}h1{font-family:"Songti SC","STSong","SimSun",serif;font-size:clamp(46px,8vw,76px);font-weight:400;letter-spacing:7px;margin:18px 0 16px}h1 span{display:inline-block;font-family:Georgia,serif;color:#a18b64;font-style:italic;font-size:.65em;vertical-align:6px;margin:0 10px}.names{font-family:Georgia,serif;font-size:13px;letter-spacing:3px;color:var(--muted)}.message{font-family:"Songti SC","STSong",serif;font-size:21px;line-height:1.9;margin:36px 0 10px}.intro{font-size:13px;line-height:2;color:var(--muted);margin:0}.divider{width:34px;height:1px;background:#b3bb9e;margin:34px auto}.test{max-width:580px;margin:0 auto;text-align:left;border:1px solid var(--line);border-radius:14px;padding:22px 24px;background:#fffdf780}.test-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.test h2{font-size:14px;font-weight:500;margin:0}.badge{font-size:10px;letter-spacing:1px;color:var(--green);white-space:nowrap}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#789267;margin-right:7px}.test p{font-size:12px;line-height:1.9;color:var(--muted);margin:12px 0}.status{font-size:12px;line-height:1.8;margin-top:16px;min-height:44px;color:var(--green)}button{font:inherit;font-size:12px;cursor:pointer;background:transparent;border:1px solid #b5bda8;border-radius:6px;padding:9px 16px;color:var(--green);margin-top:12px}button:hover{background:#edf0e5}button:focus-visible{outline:2px solid var(--green);outline-offset:3px}button:disabled{opacity:.6;cursor:wait}footer{text-align:center;font-size:10px;color:var(--muted);letter-spacing:1px;padding-top:25px;line-height:2}.footnote{font-size:10px!important;margin-bottom:0!important}@media(max-width:600px){.page{padding:22px 22px 20px}header{padding-bottom:17px;letter-spacing:1px}main{padding-top:45px}h1{letter-spacing:3px}h1 span{margin:0 3px}.art{margin-top:20px;width:160px;height:106px}.message{font-size:19px;margin-top:29px}.test{padding:19px}.names{font-size:11px;letter-spacing:2px}.tag{font-size:10px}}
  </style>
</head>
<body>
  <div class="page">
    <header><div class="brand">M <span aria-hidden="true">&</span> A</div><div class="tag">OUR LITTLE CORNER</div></header>
    <main>
      <div class="eyebrow">A LITTLE BEGINNING</div>
      <svg class="art" viewBox="0 0 190 126" role="img" aria-label="两枚相依的戒指与橄榄枝">
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="77" cy="66" r="28" stroke="#a89064" stroke-width="2"/><circle cx="113" cy="66" r="28" stroke="#a89064" stroke-width="2"/>
          <path d="M37 105C21 81 21 54 37 28M153 105c16-24 16-51 0-77" stroke="#8e9c79" stroke-width="1.6"/>
          <path d="M29 81Q9 78 17 64Q30 67 29 81M27 60Q12 47 23 39Q34 47 27 60M34 40Q27 23 41 17Q46 31 34 40M161 81q20-3 12-17q-13 3-12 17M163 60q15-13 4-21q-11 8-4 21M156 40q7-17-7-23q-5 14 7 23" fill="#a9b395" stroke="#8e9c79" stroke-width="1"/>
          <path d="m95 12 2 5 5 2-5 2-2 5-2-5-5-2 5-2Z" fill="#bba882" stroke="none"/>
        </g>
      </svg>
      <h1>梦可<span>&</span>安阳</h1>
      <div class="names">MENGKE & ANYANG</div>
      <p class="message">一起，把平凡的日子过成纪念。</p>
      <p class="intro">这是属于我们的小小主页。<br>故事慢慢写，日子慢慢过。</p>
      <div class="divider"></div>
      <section class="test" aria-labelledby="test-title">
        <div class="test-head"><h2 id="test-title">你好，欢迎来到我们的主页</h2><span class="badge"><span class="dot"></span>试营业</span></div>
        <p>这是一张小小的测试页。如果你能看到上面的名字、戒指和绿叶，页面已经来到你面前。</p>
        <div class="status" id="status" role="status" aria-live="polite">正在检测连接…</div>
        <button type="button" id="recheck">重新检测</button>
        <noscript><p>浏览器未启用 JavaScript，自动检测不可用，但主页文字与图案仍可正常显示。</p></noscript>
        <p class="footnote">也可以试试 Wi-Fi 和手机流量，再告诉我们是否打开顺畅。检测结果只显示在本机，不会上传。</p>
      </section>
    </main>
    <footer>MENGKE-ANYANG.DATE<br>从这一页，开始我们的故事。</footer>
  </div>
  <script>
    const status = document.getElementById('status');
    const button = document.getElementById('recheck');
    async function checkConnection() {
      button.disabled = true;
      status.textContent = '正在检测连接…';
      const start = performance.now();
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 12000);
      try {
        const response = await fetch('./connection-test.json?t=' + Date.now(), {cache:'no-store', signal:controller.signal});
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const data = await response.json();
        if (data.site !== 'mengke-anyang.date') throw new Error('Unexpected response');
        const seconds = ((performance.now() - start) / 1000).toFixed(2);
        status.textContent = '连接成功 · 小文件读取用时 ' + seconds + ' 秒。' + (location.protocol === 'https:' ? ' 当前使用 HTTPS 安全连接。' : ' 当前未使用 HTTPS。');
      } catch (error) {
        status.textContent = '主页已显示，但连接检测未完成。请换一个网络或点击“重新检测”再试一次。';
      } finally {
        clearTimeout(timer);
        button.disabled = false;
      }
    }
    button.addEventListener('click', checkConnection);
    checkConnection();
  </script>
</body>
</html>

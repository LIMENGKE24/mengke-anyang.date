<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850"><rect width="1000" height="850" fill="#eee8dc"/><g font-family="'Songti SC',SimSun,serif" fill="#423a30"><text x="60" y="66" font-size="30">陕西宾馆 · 会场位置示意</text><text x="60" y="102" font-size="18" fill="#7c6c58">辨认会场与停车区域 · 不按比例</text><rect x="45" y="166" width="910" height="573" rx="35" fill="#e1ddce" stroke="#b6ad97" stroke-width="2"/><path d="M580 145V283H330V585H805" fill="none" stroke="#f8f5ed" stroke-width="54" stroke-linejoin="round"/><path d="M580 145V283H330V490" fill="none" stroke="#ad9980" stroke-width="3" stroke-dasharray="9 10"/><rect x="502" y="128" width="156" height="48" rx="24" fill="#645746"/><text x="580" y="160" text-anchor="middle" fill="#fff" font-size="22">宾馆入口</text><rect x="236" y="196" width="217" height="59" rx="6" fill="#c1b5a0"/><text x="344" y="235" text-anchor="middle" font-size="24">18号楼</text><rect x="85" y="276" width="165" height="292" rx="10" fill="#6b4540"/><text x="167" y="379" fill="#fff" text-anchor="middle" font-size="29">陕西大会堂</text><path d="M113 406H220" stroke="#cdb4a3"/><text x="167" y="449" fill="#fff" text-anchor="middle" font-size="27">咸阳厅</text><text x="167" y="488" fill="#e4d4c9" text-anchor="middle" font-size="18">婚礼会场</text><rect x="275" y="355" width="217" height="194" rx="12" fill="#f4e6cc" stroke="#b39262" stroke-width="2"/><circle cx="384" cy="400" r="25" fill="#886b44"/><text x="384" y="410" text-anchor="middle" font-size="30" fill="#fff">P</text><text x="384" y="459" text-anchor="middle" font-size="24">大会堂前广场</text><text x="384" y="499" text-anchor="middle" font-size="23" fill="#745731">免费停车</text><path d="M647 355C710 318 842 357 861 449S810 550 741 523S592 440 647 355Z" fill="#bfcac4"/><text x="748" y="429" text-anchor="middle" font-size="23" fill="#657970">园林与湖区</text><g fill="#c6cbb5"><circle cx="550" cy="387" r="25"/><circle cx="557" cy="470" r="32"/><circle cx="847" cy="636" r="32"/><circle cx="733" cy="661" r="24"/><circle cx="628" cy="636" r="33"/></g><text x="90" y="651" font-size="22">车辆可自由进出陕西宾馆</text><text x="90" y="693" font-size="19" fill="#7c6c58">入园后，请按现场「陕西大会堂」指示前往</text><text x="60" y="789" font-size="18" fill="#796c5c">入口及建筑为位置示意，不代表实际行车路线。</text><text x="60" y="821" font-size="18" fill="#796c5c">停车安排：大会堂前广场 · 以婚礼当天现场引导为准。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620"><rect width="1000" height="620" fill="#eee8dc"/><g font-family="'Songti SC',SimSun,serif" fill="#423a30"><text x="48" y="52" font-size="29">陕西宾馆 · 会场位置示意</text><text x="48" y="87" font-size="19" fill="#7c6c58">会场与停车区域 · 不按比例</text><rect x="40" y="139" width="920" height="382" rx="28" fill="#e1ddce" stroke="#b6ad97" stroke-width="2"/><path d="M590 125V239H322V455H820" fill="none" stroke="#f8f5ed" stroke-width="43" stroke-linejoin="round"/><path d="M590 125V239H322V335" fill="none" stroke="#ad9980" stroke-width="3" stroke-dasharray="9 10"/><rect x="512" y="114" width="156" height="45" rx="22" fill="#645746"/><text x="590" y="145" text-anchor="middle" fill="#fff" font-size="22">宾馆入口</text><rect x="239" y="170" width="215" height="46" rx="6" fill="#c1b5a0"/><text x="346" y="201" text-anchor="middle" font-size="23">18号楼</text><rect x="78" y="254" width="166" height="222" rx="9" fill="#6b4540"/><text x="161" y="322" fill="#fff" text-anchor="middle" font-size="28">陕西大会堂</text><path d="M109 345H213" stroke="#cdb4a3"/><text x="161" y="387" fill="#fff" text-anchor="middle" font-size="26">咸阳厅</text><text x="161" y="429" fill="#e4d4c9" text-anchor="middle" font-size="19">婚礼会场</text><rect x="273" y="286" width="213" height="144" rx="12" fill="#f4e6cc" stroke="#b39262" stroke-width="2"/><text x="379" y="327" text-anchor="middle" font-size="23">大会堂前广场</text><circle cx="318" cy="381" r="22" fill="#886b44"/><text x="318" y="389" text-anchor="middle" font-size="26" fill="#fff">P</text><text x="402" y="389" text-anchor="middle" font-size="22" fill="#745731">免费停车</text><path d="M672 252C738 222 858 254 866 321S817 423 739 399S602 310 672 252Z" fill="#bfcac4"/><text x="751" y="330" text-anchor="middle" font-size="24" fill="#657970">园林与湖区</text><g fill="#c6cbb5"><circle cx="551" cy="300" r="23"/><circle cx="560" cy="380" r="29"/><circle cx="845" cy="476" r="24"/><circle cx="647" cy="484" r="20"/></g><text x="48" y="563" font-size="21">入园后，请按现场「陕西大会堂」指示前往。</text><text x="48" y="597" font-size="18" fill="#796c5c">仅表示位置关系，不代表实际行车路线；请以婚礼当天现场引导为准。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" role="img" aria-labelledby="title desc">
<title id="title">陕西宾馆两处入口与婚礼会场路线示意图</title><desc id="desc">北侧科技八路辅路的陕西宾馆北门，东侧丈八东路辅路的陕西宾馆东北门。西侧丈八四路作方位参照。两条路线分别连接北门、东北门与大会堂前广场。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L6 3L0 6" fill="none" stroke="#915e4e" stroke-width="1.3"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L6 3L0 6" fill="none" stroke="#4e7468" stroke-width="1.3"/></marker></defs>
